[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complaint-triage"
version = "0.1.0"
description = "Routing consumer-finance complaints with classical, neural and distilled models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "pyarrow>=16.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "joblib>=1.4",
]

[project.optional-dependencies]
neural = ["tensorflow>=2.17", "keras>=3.5"]
teacher = ["torch>=2.3", "transformers>=4.44", "datasets>=2.20", "accelerate>=0.33"]
deploy = ["onnx>=1.16", "onnxruntime>=1.18", "tf2onnx>=1.16"]
analysis = ["umap-learn>=0.5", "shap>=0.45", "jupyterlab>=4.2", "ipywidgets>=8.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
